name: Job worker image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['job-worker/**', '.github/workflows/job-worker.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: job-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-jobs:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,scope=jobs,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ghcr.io/${{ github.repository }}-jobs@${{ steps.image.outputs.digest }}
          version: v0.76.0
          format: json
          output: job-image-security.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Record immutable image
        run: echo 'ghcr.io/${{ github.repository }}-jobs@${{ steps.image.outputs.digest }}' > job-image.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-worker-evidence
          path: |
            job-image.txt
            job-image-security.json
