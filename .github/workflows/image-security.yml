name: Image security review
on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable image to scan
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ${{ inputs.image }}
          version: v0.76.0
          format: json
          output: image-security.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-security
          path: image-security.json
